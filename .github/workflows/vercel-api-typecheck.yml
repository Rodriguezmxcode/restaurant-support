name: Vercel API Typecheck
on:
  push:
    branches: [opsvista-migration-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: opsvista/package-lock.json
      - name: Install
        working-directory: opsvista
        run: npm install
      - name: Frontend typecheck
        working-directory: opsvista
        run: npm run typecheck
      - name: Vercel API typecheck
        working-directory: opsvista
        run: npm run typecheck:vercel
      - name: Build
        working-directory: opsvista
        run: npm run build

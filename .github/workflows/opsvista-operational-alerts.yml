name: OpsVista operational alerts
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/opsvista-operational-alerts.yml']
permissions:
  id-token: write
  contents: read
concurrency:
  group: opsvista-operational-alerts
  cancel-in-progress: false
jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check operational sources and deliver due alerts
        shell: bash
        run: |
          node --input-type=module <<'JS'
          // No checkout, permanent token, customer data, or notification text in logs.
          const verify = process.env.GITHUB_EVENT_NAME === 'push';
          async function request(params) {
            const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            tokenUrl.searchParams.set('audience','opsvista-operational-alerts');
            const identity = await fetch(tokenUrl,{headers:{Authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`},signal:AbortSignal.timeout(15000)});
            if (!identity.ok) throw new Error(`identity HTTP ${identity.status}`);
            const {value:token} = await identity.json();
            if (!token) throw new Error('missing identity');
            console.log(`::add-mask::${token}`);
            const url = new URL('https://restaurant-support.vercel.app/api/workflows');
            url.searchParams.set('resource','scheduled_alerts');
            for (const [key,value] of Object.entries(params)) if (value) url.searchParams.set(key,value);
            if (verify) url.searchParams.set('verify','1');
            const response = await fetch(url,{method:'POST',headers:{Authorization:`Bearer ${token}`},signal:AbortSignal.timeout(125000)});
            const result = await response.json().catch(()=>({}));
            if (!response.ok || !result.ok) throw new Error(`HTTP ${response.status}`);
            return result;
          }
          const plan = await request({job:'plan'});
          if (!Array.isArray(plan.jobs)) throw new Error('Invalid scheduler plan');
          const jobs = plan.jobs;
          let cursor = 0, failures = Number(plan.configurationFailures) || 0;
          async function worker() {
            while (cursor < jobs.length) {
              const {job,location,organizationId} = jobs[cursor++];
              try {
                const result = await request({job,location,organizationId});
                console.log(`${job}: ${verify ? 'verified without sending' : result.quiet ? 'quiet hours' : result.busy ? 'already checked' : 'checked'}`);
              } catch (error) {
                failures++;
                console.log(`::warning::${job}: ${error.message}. Other checks continue; the next run retries.`);
              }
            }
          }
          await Promise.all([worker(),worker()]);
          if (failures) throw new Error(`${failures} source check(s) unavailable; see individual job status in OpsVista.`);
          JS

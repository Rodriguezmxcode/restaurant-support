name: Finalize tenant-safe Google integration routing
on:
  push:
    branches: [opsvista-migration-v1]
    paths: ['.github/workflows/enable-corporate-integrations.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opsvista-migration-v1
      - name: Add platform OAuth fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path('opsvista/api/workflows.ts')
          text = path.read_text()
          start = text.index('async function googleBusinessIntegration(')
          end = text.index('\nasync function googleBusinessCallback(', start)
          replacement = r'''async function googleBusinessIntegration(req:ApiRequest,res:ApiResponse,user:NonNullable<ReturnType<typeof readSession>>){
 const permission=authorize(user,'integrations:manage');if(!permission.ok)return res.status(permission.status).json({error:permission.error});
 const organizationId=userOrganization(user);
 const platformClientId=process.env.GOOGLE_BUSINESS_PROFILE_CLIENT_ID?.trim()||'';
 const platformClientSecret=process.env.GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET?.trim()||'';
 const platformManaged=Boolean(platformClientId&&platformClientSecret);
 let saved=await getGoogleBusinessCredentials(organizationId);
 if(!req.method||req.method==='GET'){
  const redirectUri=googleBusinessRedirectUri(req.headers||{});
  if(q(req,'action')==='authorize'){
   if((!saved?.clientId||!saved.clientSecret)&&platformManaged){await saveGoogleBusinessClient(organizationId,platformClientId,platformClientSecret);saved=await getGoogleBusinessCredentials(organizationId);}
   if(!saved?.clientId||!saved.clientSecret)return res.status(400).json({error:'Google OAuth client is not configured for OpsVista'});
   if(!res.setHeader||!res.end)return res.status(500).json({error:'Google redirect is unavailable'});
   res.setHeader('Location',authorizationUrl(saved,redirectUri,createOAuthState(organizationId,user.id)));res.status(302).end?.();return;
  }
  return res.status(200).json({provider:'google-business-profile',configured:Boolean((saved?.clientId&&saved.clientSecret)||platformManaged),connected:Boolean(saved?.refreshToken),clientId:saved?.clientId||platformClientId,connectedEmail:saved?.connectedEmail,connectedAt:saved?.connectedAt,redirectUri,platformManaged});
 }
 if(req.method==='POST'){
  const action=text(req.body?.action);
  if(action==='save'){
   if(!hasLegacyWorkspace(user))return res.status(403).json({error:'Google OAuth client configuration is managed by OpsVista for customer organizations'});
   const clientId=text(req.body?.clientId),clientSecret=text(req.body?.clientSecret);
   if(!clientId.endsWith('.apps.googleusercontent.com')||!clientSecret.startsWith('GOCSPX-'))return res.status(400).json({error:'A valid Google OAuth Client ID and Client Secret are required'});
   await saveGoogleBusinessClient(organizationId,clientId,clientSecret);return res.status(200).json({saved:true});
  }
  if(action==='disconnect'){await disconnectGoogleBusiness(organizationId);return res.status(200).json({disconnected:true});}
  return res.status(400).json({error:'Unknown integration action'});
 }
 res.setHeader?.('Allow','GET, POST');return res.status(405).json({error:'Method not allowed'});
}
'''
          path.write_text(text[:start] + replacement + text[end:])
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "OpsVista Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/enable-corporate-integrations.yml
          git add opsvista/api/workflows.ts
          git commit -m "Support tenant-managed Google Business connections"
          git push origin HEAD:opsvista-migration-v1

name: Corporate Import Visible CI
on:
  push:
    branches: [codex/corporate-import-visible-button]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: opsvista/package-lock.json
      - name: Install
        working-directory: opsvista
        run: npm install
      - name: Typecheck
        working-directory: opsvista
        run: npm run typecheck
      - name: Build
        working-directory: opsvista
        run: npm run build

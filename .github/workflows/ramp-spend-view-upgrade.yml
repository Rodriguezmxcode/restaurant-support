name: Ramp spend reconciliation view
on:
  push:
    branches: [opsvista-migration-v1]
    paths: ['.github/workflows/ramp-spend-view-upgrade.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opsvista-migration-v1
      - name: Upgrade Ramp spend decision view
        run: python opsvista/scripts/patch-ramp-spend-view.py
      - name: Commit changes
        run: |
          git config user.name "OpsVista Automation"
          git config user.email "actions@users.noreply.github.com"
          git add opsvista/src/RampComplianceView.tsx opsvista/src/rampCompliance.css
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Clarify Ramp total vs exposed spend and add reconciliation"
          git push origin HEAD:opsvista-migration-v1

name: Ramp spend reconciliation view
on:
  push:
    branches: [opsvista-migration-v1]
    paths: ['.github/workflows/ramp-spend-view-upgrade.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opsvista-migration-v1
      - name: Upgrade Ramp spend decision view
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('opsvista/src/RampComplianceView.tsx')
          text = path.read_text()

          old = "type RampPeriod = 'today' | 'yesterday' | 'this_week' | 'prior_week' | 'last_30' | 'custom';"
          new = old + "\ntype RampSpendView = 'total' | 'exposed';"
          if old not in text:
              raise SystemExit('RampPeriod anchor not found')
          text = text.replace(old, new, 1)

          old = "  const [assignmentError, setAssignmentError] = useState('');"
          new = old + "\n  const [spendView, setSpendView] = useState<RampSpendView>('exposed');"
          if old not in text:
              raise SystemExit('state anchor not found')
          text = text.replace(old, new, 1)

          old = "  const locationRows = useMemo(() => groupRampCompliance(results, 'department'), [results]);\n  const overdueRows = useMemo(() => results.filter(tx => tx.overdue), [results]);"
          new = """  const locationRows = useMemo(() => groupRampCompliance(results, 'department'), [results]);
  const spendReconciliation = useMemo(() => {
    const unassigned = locationRows.find(row => row.key === 'Unassigned')?.totalSpend || 0;
    const assigned = locationRows.filter(row => row.key !== 'Unassigned').reduce((sum, row) => sum + row.totalSpend, 0);
    const difference = Math.round((summary.totalSpend - assigned - unassigned) * 100) / 100;
    return { assigned, unassigned, difference };
  }, [locationRows, summary.totalSpend]);
  const spendInsightRows = useMemo(() => locationRows.map(row => ({
    location: row.key === 'Unassigned' ? 'Unassigned / Needs classification' : row.key,
    primary: spendView === 'total' ? row.totalSpend : row.exposedSpend,
    secondary: row.score,
    status: row.key === 'Unassigned' && row.totalSpend > 0 ? 'bad' as const : row.score < 70 ? 'bad' as const : row.score < 90 ? 'watch' as const : 'good' as const,
  })), [locationRows, spendView]);
  const overdueRows = useMemo(() => results.filter(tx => tx.overdue), [results]);"""
          if old not in text:
              raise SystemExit('locationRows anchor not found')
          text = text.replace(old, new, 1)

          old = '''    {!managerMode&&!!locationRows.length&&<MaxDataInsights title="Gasto expuesto y cumplimiento" subtitle="Comparación por restaurante o departamento; los filtros cruzados revelan dónde falta evidencia y cuánto gasto está en riesgo." rows={locationRows.map(row=>({location:row.key,primary:row.exposedSpend,secondary:row.score,status:row.score<70?'bad':row.score<90?'watch':'good'}))} primaryLabel="Gasto expuesto" secondaryLabel="Compliance score" primaryFormat={value=>money(value)} secondaryFormat={value=>`${value.toFixed(0)} / 100`} conclusion={filtered=>{if(!filtered.length)return['Sin gastos para este filtro.'];const exposure=[...filtered].sort((a,b)=>b.primary-a.primary);const compliance=[...filtered].sort((a,b)=>(a.secondary??100)-(b.secondary??100));const alerts=filtered.filter(row=>row.status!=='good');return[`${exposure[0].location} concentra ${money(exposure[0].primary)} de gasto expuesto.`,`${compliance[0].location} tiene el menor compliance score: ${(compliance[0].secondary??0).toFixed(0)} / 100.`,alerts.length?`Solicita recibos y memos en ${alerts.map(row=>row.location).join(', ')}.`:'Todas las unidades visibles alcanzan 90 puntos o más.'];}}/>}'''
          new = '''    {!managerMode&&!!locationRows.length&&<>
      <section className="ramp-spend-audit">
        <div className="ramp-spend-audit-head"><div><span>RAMP SPEND AUDIT</span><strong>Conciliación por locación / departamento</strong><small>El gasto total siempre debe quedar explicado entre asignado y sin asignar.</small></div><div className="ramp-spend-toggle" role="group" aria-label="Vista de gasto Ramp"><button type="button" className={spendView==='total'?'active':''} onClick={()=>setSpendView('total')}>Total Spend</button><button type="button" className={spendView==='exposed'?'active':''} onClick={()=>setSpendView('exposed')}>Exposed Spend</button></div></div>
        <div className="ramp-spend-reconciliation"><article><span>RAMP TOTAL</span><strong>{money(summary.totalSpend)}</strong><small>100% del periodo seleccionado</small></article><article><span>ASSIGNED</span><strong>{money(spendReconciliation.assigned)}</strong><small>Restaurantes / departamentos identificados</small></article><article className={spendReconciliation.unassigned>0?'needs-classification':''}><span>UNASSIGNED</span><strong>{money(spendReconciliation.unassigned)}</strong><small>{spendReconciliation.unassigned>0?'Needs classification':'Todo el gasto tiene asignación'}</small></article><article className={Math.abs(spendReconciliation.difference)>0.01?'out-of-balance':'balanced'}><span>DIFFERENCE</span><strong>{money(spendReconciliation.difference)}</strong><small>{Math.abs(spendReconciliation.difference)<=0.01?'Conciliado ✓':'Revisar agrupación'}</small></article></div>
      </section>
      <MaxDataInsights title={spendView==='total'?'Gasto total por locación / departamento':'Gasto con excepciones de compliance'} subtitle={spendView==='total'?'Distribución del 100% del gasto Ramp; Unassigned identifica transacciones que todavía necesitan clasificación.':'Solo muestra transacciones con alguna excepción de compliance; no representa el gasto total de Ramp.'} rows={spendInsightRows} primaryLabel={spendView==='total'?'Total Spend':'Gasto con excepciones'} secondaryLabel="Compliance score" primaryFormat={value=>money(value)} secondaryFormat={value=>`${value.toFixed(0)} / 100`} conclusion={filtered=>{if(!filtered.length)return['Sin gastos para este filtro.'];const ranked=[...filtered].sort((a,b)=>b.primary-a.primary);const compliance=[...filtered].sort((a,b)=>(a.secondary??100)-(b.secondary??100));const unassigned=filtered.find(row=>row.location.startsWith('Unassigned'));return[spendView==='total'?`${ranked[0].location} concentra ${money(ranked[0].primary)} del gasto total.`:`${ranked[0].location} concentra ${money(ranked[0].primary)} de gasto con excepciones.`,unassigned&&unassigned.primary>0?`${money(unassigned.primary)} todavía requiere asignación de restaurante o departamento.`:`No hay gasto sin asignación dentro de este filtro.`,`${compliance[0].location} tiene el menor compliance score: ${(compliance[0].secondary??0).toFixed(0)} / 100.`];}}/>
    </>}'''
          if old not in text:
              raise SystemExit('MaxDataInsights block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          css_path = Path('opsvista/src/rampCompliance.css')
          css = css_path.read_text()
          marker = '/* Ramp spend audit reconciliation */'
          if marker not in css:
              css += '''\n\n/* Ramp spend audit reconciliation */\n.ramp-spend-audit{border:1px solid #c8d7e8;border-radius:18px;background:#fff;overflow:hidden}.ramp-spend-audit-head{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 22px;background:linear-gradient(90deg,#f8fbff,#eef5ff);border-bottom:1px solid #d8e4f0}.ramp-spend-audit-head>div:first-child{display:grid;gap:4px}.ramp-spend-audit-head span{font-size:11px;font-weight:800;letter-spacing:.14em;color:#2a68c7}.ramp-spend-audit-head strong{font-size:18px;color:#10243f}.ramp-spend-audit-head small{color:#61738d}.ramp-spend-toggle{display:flex;gap:6px;padding:4px;border:1px solid #c7d7e8;border-radius:999px;background:#fff}.ramp-spend-toggle button{border:0;background:transparent;border-radius:999px;padding:8px 13px;font-weight:750;color:#40546f;cursor:pointer}.ramp-spend-toggle button.active{background:#1d65d8;color:#fff}.ramp-spend-reconciliation{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}.ramp-spend-reconciliation article{padding:16px 20px;border-right:1px solid #e1e9f2;display:grid;gap:4px}.ramp-spend-reconciliation article:last-child{border-right:0}.ramp-spend-reconciliation span{font-size:11px;font-weight:800;letter-spacing:.1em;color:#60738d}.ramp-spend-reconciliation strong{font-size:23px;color:#10243f}.ramp-spend-reconciliation small{color:#6c7e93}.ramp-spend-reconciliation .needs-classification{background:#fff7ed}.ramp-spend-reconciliation .needs-classification strong{color:#c2410c}.ramp-spend-reconciliation .out-of-balance{background:#fff1f2}.ramp-spend-reconciliation .out-of-balance strong{color:#b42318}.ramp-spend-reconciliation .balanced{background:#eefbf4}.ramp-spend-reconciliation .balanced strong{color:#16794a}@media(max-width:850px){.ramp-spend-audit-head{align-items:flex-start;flex-direction:column}.ramp-spend-reconciliation{grid-template-columns:repeat(2,minmax(0,1fr))}.ramp-spend-reconciliation article:nth-child(2){border-right:0}.ramp-spend-reconciliation article:nth-child(-n+2){border-bottom:1px solid #e1e9f2}}@media(max-width:520px){.ramp-spend-reconciliation{grid-template-columns:1fr}.ramp-spend-reconciliation article{border-right:0;border-bottom:1px solid #e1e9f2}.ramp-spend-reconciliation article:last-child{border-bottom:0}.ramp-spend-toggle{width:100%}.ramp-spend-toggle button{flex:1}}\n'''
              css_path.write_text(css)
          PY
      - name: Commit changes
        run: |
          git config user.name "OpsVista Automation"
          git config user.email "actions@users.noreply.github.com"
          git add opsvista/src/RampComplianceView.tsx opsvista/src/rampCompliance.css
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Clarify Ramp total vs exposed spend and add reconciliation"
          git push origin HEAD:opsvista-migration-v1
